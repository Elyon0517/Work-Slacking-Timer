<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Work Slacking Timer</title>
    <meta name="theme-color" content="#FFD700">
    <meta name="description" content="把工作时间换算成看得见的收入。免费、无需登录的薪资计时器，支持人民币、美元和中英文。">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='29' fill='%23ffd700'/%3E%3Ctext x='32' y='44' text-anchor='middle' font-size='38' font-family='sans-serif'%3E%C2%A5%3C/text%3E%3C/svg%3E">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
        }
        body {
            min-height: 100vh;
            min-height: 100dvh;
            height: auto;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 0;
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #1a1a1a, #2a2a2a);
            color: #fff;
        }

        .container {
            max-width: 800px;
            width: 100%;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100dvh;
            height: auto;
            position: relative;
        }

        .language-switcher {
            position: absolute;
            top: 1rem;
            right: 1rem;
            display: flex;
            gap: 0.5rem;
            z-index: 1000;
        }

        .language-btn {
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.9rem;
        }

        .language-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .language-btn.active {
            background: #4CAF50;
        }

        .input-group {
            margin: 2rem 0;
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
            width: 100%;
        }
        .input-group > * {
            margin: 0;
        }
        .salary-input-wrapper {
            display: flex;
            align-items: center;
            position: relative;
            min-width: 200px;
            max-width: 260px;
            width: 220px;
            box-sizing: border-box;
        }
        .salary-input-wrapper,
        #workHours,
        .salary-type {
            min-width: 200px;
            max-width: 260px;
            width: 220px;
            box-sizing: border-box;
        }
        .salary-type select,
        .salary-input,
        #workHours {
            padding: 0.8rem;
            border: none;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            font-size: 1rem;
            width: 100%;
            box-sizing: border-box;
        }
        .salary-type select {
            appearance: none;
            -webkit-appearance: none;
            -moz-appearance: none;
        }
        .salary-input {
            padding-left: 2.2rem !important;
            padding-right: 0.8rem !important;
        }
        .currency-suffix {
            position: absolute;
            left: 0.7rem;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1rem;
            color: #fff;
            cursor: pointer;
            user-select: none;
            opacity: 0.85;
            transition: color 0.2s, opacity 0.2s;
            z-index: 2;
            border: 0;
            background: transparent;
        }
        .currency-suffix:hover {
            color: #4CAF50;
            opacity: 1;
        }
        .center-btn {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 7rem;
        }
        .center-btn button {
            width: 220px;
            font-size: 1rem;
            padding: 0.8rem 2rem;
            border: none;
            border-radius: 8px;
            background: #4CAF50;
            color: white;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
        }
        .center-btn button:hover {
            transform: translateY(-2px);
            background: #45a049;
        }
        .center-btn button:disabled {
            background: #666;
            cursor: not-allowed;
            transform: none;
        }
        .salary-display {
            font-size: 2.8rem;
            font-weight: bold;
            margin: 1.5rem 0 0.5rem 0;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
            transition: transform 0.3s;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 3.5rem;
        }
        .salary-display .worktime {
            font-size: 1.2rem;
            color: #ffd700;
            margin-top: 0.5rem;
            text-shadow: none;
            font-weight: normal;
        }
        /* 全宽弹窗 */
        .salary-full-dialog {
            position: fixed;
            left: 0;
            top: 0;
            width: 100vw;
            height: 100dvh;
            padding: 20px;
            overflow-y: auto;
            background: rgba(34, 34, 34, 0.98);
            color: #fff;
            z-index: 9999;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .salary-full-dialog-content {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.18);
            border-radius: 18px;
            padding: 2.5rem 1rem 2rem 1rem;
        }
        .salary-full-dialog .dialog-earned-title {
            font-size: 2.5rem;
            font-weight: bold;
            color: #fffbe6;
            margin-bottom: 1.2rem;
            text-align: center;
            text-shadow: 0 2px 12px #bfa800, 0 0 30px #fffbe6;
        }
        .salary-full-dialog .dialog-earned-amount {
            font-size: 3.2rem;
            font-weight: bold;
            color: #fffbe6;
            margin-bottom: 1.5rem;
            text-align: center;
            text-shadow: 0 2px 18px #bfa800, 0 0 30px #fffbe6;
        }
        .salary-full-dialog .dialog-row {
            font-size: 1.3rem;
            margin: 0.7rem 0;
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 400px;
        }
        .salary-full-dialog .dialog-row .label {
            color: #aaa;
        }
        .salary-full-dialog .dialog-row .value {
            font-weight: bold;
            color: #ffd700;
        }
        .salary-full-dialog .dialog-cancel {
            margin-top: 2.2rem;
            width: 220px;
            font-size: 1rem;
            padding: 0.8rem 2rem;
            border: none;
            border-radius: 8px;
            background: #4CAF50;
            color: white;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
        }
        .salary-full-dialog .dialog-cancel:hover {
            transform: translateY(-2px);
            background: #45a049;
        }
        .salary-full-dialog .dialog-pause {
            margin-top: 2.2rem;
            margin-right: 1rem;
            width: 220px;
            font-size: 1rem;
            padding: 0.8rem 2rem;
            border: none;
            border-radius: 8px;
            background: #FFA500;
            color: white;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
            display: inline-block;
        }
        .salary-full-dialog .dialog-pause:hover {
            transform: translateY(-2px);
            background: #e69500;
        }
        .currency-select {
            margin-bottom: 1rem;
        }

        .salary-type select,
        .currency-select select {
            padding: 0.8rem;
            border: none;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            font-size: 1rem;
            width: 200px;
            cursor: pointer;
            outline: none;
            box-shadow: none;
            appearance: none;
            -webkit-appearance: none;
            -moz-appearance: none;
            transition: border 0.2s, box-shadow 0.2s;
        }
        .salary-type select:focus,
        .currency-select select:focus {
            border: 2px solid #4CAF50;
            box-shadow: 0 0 0 2px #4CAF5033;
        }
        .salary-type select option,
        .currency-select select option {
            background: #2a2a2a;
            color: #fff;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
            margin: 2rem 0;
            font-size: 1.2rem;
        }

        .stat-item {
            background: rgba(255, 255, 255, 0.05);
            padding: 1rem;
            border-radius: 8px;
            transition: transform 0.3s;
        }

        .stat-item:hover {
            transform: translateY(-2px);
            background: rgba(255, 255, 255, 0.1);
        }

        .coin {
            position: absolute;
            width: 30px;
            height: 30px;
            background: gold;
            border-radius: 50%;
            pointer-events: none;
            animation: fall 2s linear forwards;
        }

        @keyframes fall {
            0% {
                transform: translateY(-100vh) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(100vh) rotate(360deg);
                opacity: 0;
            }
        }

        .glow {
            animation: glow 1s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from {
                text-shadow: 0 0 10px #fff, 0 0 20px #fff, 0 0 30px #4CAF50;
            }
            to {
                text-shadow: 0 0 20px #fff, 0 0 30px #4CAF50, 0 0 40px #4CAF50;
            }
        }

        .currency-amount {
            display: flex;
            align-items: baseline;
            gap: 0.5rem;
            font-size: 1.2rem;
        }

        .currency-amount span {
            font-size: 0.9em;
            opacity: 0.8;
        }

        input[type=number]::-webkit-inner-spin-button,
        input[type=number]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type=number] {
            -moz-appearance: textfield;
        }
        .center-panel { width: min(100%, 760px); padding: 0 20px; }
        .hours-wrapper, .salary-type { position: relative; }
        .hours-wrapper { width: 220px; min-width: 200px; max-width: 260px; }
        .input-caption { position: absolute; left: 0; top: -24px; color: #aaa; font-size: 0.8rem; }
        .intro, .page-note { color: #aaa; font-size: 0.9rem; line-height: 1.7; text-align: center; }
        .intro { margin: 16px 20px 0; }
        .page-note { margin: 12px 20px; max-width: 620px; }
        .page-note a, .dialog-source { color: #ffd700; }
        .dialog-brand { color: #b8b5a4; letter-spacing: 0.16em; font-size: 0.75rem; margin-bottom: 24px; }
        .rate-note { color: #b8b5a4; font-size: 0.8rem; line-height: 1.7; text-align: center; margin: 20px 0 0; }
        .dialog-source { margin-top: 22px; font-size: 0.8rem; text-decoration: none; }
        .dialog-actions { display: flex; justify-content: center; width: 100%; gap: 16px; }
        .dialog-actions button { margin-right: 0 !important; }
        button:focus-visible, a:focus-visible { outline: 2px solid #ffd700; outline-offset: 4px; }
        .currency-suffix:disabled { cursor: default; opacity: 0.45; }
        @media (max-width: 600px) {
            .container { padding: 90px 18px 24px; }
            .input-group { flex-direction: column; align-items: center; gap: 36px; margin: 40px 0 0; }
            h1 { font-size: 1.7rem; }
            .salary-full-dialog { padding: 16px; }
            .salary-full-dialog-content { padding: 24px 14px; }
            .salary-full-dialog .dialog-earned-title { font-size: 1.7rem; }
            .salary-full-dialog .dialog-earned-amount { font-size: clamp(1.4rem, 7vw, 2.2rem); }
            .salary-full-dialog .dialog-row { font-size: 0.95rem; gap: 12px; }
            .dialog-row .value { text-align: right; }
            .dialog-actions button { width: auto !important; flex: 1; padding: 12px !important; margin-top: 24px !important; }
            .dialog-brand { font-size: 0.65rem; letter-spacing: 0.1em; }
        }
        @media (prefers-reduced-motion: reduce) {
            .glow { animation: none; }
            .coin { display: none; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="language-switcher">
            <button class="language-btn active" data-lang="zh">中文</button>
            <button class="language-btn" data-lang="en">English</button>
        </div>
        <h1 class="glow">摸鱼计时器</h1>
        <p class="intro" id="intro">把工作时间，换算成看得见的收入。</p>
        <div class="center-panel">
            <div class="input-group">
                <div class="salary-input-wrapper">
                    <label class="input-caption" id="salaryLabel" for="salaryAmount">薪资</label>
                    <input type="number" id="salaryAmount" aria-label="薪资" class="salary-input" placeholder="薪资" min="0" step="0.01">
                    <button type="button" class="currency-suffix" id="currencySuffix" aria-label="切换薪资币种">¥</button>
                </div>
                <div class="hours-wrapper">
                    <label class="input-caption" id="hoursLabel" for="workHours">每天工作时长（小时）</label>
                    <input type="number" id="workHours" max="24" aria-label="每天工作时长（小时）" placeholder="每天工作时长（小时）" min="0" step="0.5">
                </div>
                <div class="salary-type">
                    <label class="input-caption" id="periodLabel" for="salaryType">薪资周期</label>
                    <select id="salaryType" aria-label="薪资周期">
                        <option value="biweekly">两周薪</option>
                        <option value="monthly">月薪</option>
                        <option value="yearly">年薪</option>
                    </select>
                </div>
            </div>
        </div>
        <div class="center-btn" id="centerBtnBox">
            <button id="startBtn" disabled>开始计时</button>
        </div>
        <div class="salary-display dual-currency" id="salaryDisplay" style="display:none;">
            <div class="currency-amount" id="salaryAmountDisplay">
                <span>¥0.00</span>
                <span>(≈$0.00)</span>
            </div>
            <div class="worktime" id="workTimeDisplay">00:00:00</div>
        </div>
        <div class="progress-container">
            <div class="progress-bar" id="progressBar"></div>
        </div>
        <p class="page-note" id="pageNote">无需登录，不保存薪资。金额按固定工作日假设估算，仅作趣味参考。<br><a href="https://github.com/Elyon0517/Work-Slacking-Timer">Elyon0517 / GitHub ↗</a></p>
        <div class="salary-full-dialog" id="salaryFullDialog" role="dialog" aria-modal="true" aria-labelledby="earnedTitle" tabindex="-1">
            <div class="salary-full-dialog-content">
                <div class="dialog-brand">WORK SLACKING TIMER · ELYON0517</div>
                <div class="dialog-earned-title" id="earnedTitle">您已经赚到</div>
                <div class="dialog-earned-amount" id="fullDialogSalary">$0.00 (¥0.00)</div>
                <div class="dialog-row"><span class="label">已工作时长</span><span class="value" id="fullDialogTime">00:00:00</span></div>
                <div class="dialog-row"><span class="label">每秒收入</span><span class="value" id="fullDialogPerSecond">$0.00 (¥0.00)</span></div>
                <div class="dialog-row"><span class="label">每小时收入</span><span class="value" id="fullDialogPerHour">$0.00 (¥0.00)</span></div>
                <div class="dialog-row"><span class="label">每日收入</span><span class="value" id="fullDialogPerDay">$0.00 (¥0.00)</span></div>
                <div class="dialog-actions">
                    <button class="dialog-pause" id="fullDialogPause">暂停</button>
                    <button class="dialog-cancel" id="fullDialogCancel">取消计时</button>
                </div>
                <p class="rate-note" id="rateNote"></p>
                <a class="dialog-source" href="https://github.com/Elyon0517/Work-Slacking-Timer">GitHub · Work-Slacking-Timer ↗</a>
            </div>
        </div>
    </div>

    <script>
        class SalaryCalculator {
            constructor() {
                this.salaryAmount = 0;
                this.workHours = 0;
                this.startTime = null;
                this.interval = null;
                this.lastCoinTime = 0;
                this.totalSalary = 0;
                this.isRunning = false;
                this.isPaused = false;
                this.salaryType = 'biweekly';
                this.currency = 'CNY';
                this.exchangeRate = 7.2;
                this.rateSource = 'fallback';
                this.pausedAt = null;
                this.lastExchangeRateUpdate = 0;
                this.currentLang = 'zh';

                this.translations = {
                    zh: {
                        title: '摸鱼计时器',
                        salary: '薪资',
                        workHours: '每天工作时长（小时）',
                        biweekly: '两周薪',
                        monthly: '月薪',
                        yearly: '年薪',
                        start: '开始计时',
                        stop: '停止计时',
                        pause: '暂停',
                        resume: '继续',
                        cancel: '取消计时',
                        earned: '您已经赚到',
                        workTime: '已工作时长',
                        perSecond: '每秒收入',
                        perHour: '每小时收入',
                        perDay: '每日收入',
                        intro: '把工作时间，换算成看得见的收入。',
                        privacy: '无需登录，不保存薪资。金额按固定工作日假设估算，仅作趣味参考。',
                        period: '薪资周期',
                        currency: '切换薪资币种',
                        referenceRate: '接口参考汇率',
                        fallbackRate: '备用参考汇率',
                        estimate: '估算金额，不代表实际工资到账'
                    },
                    en: {
                        title: 'Real-time Salary Calculator',
                        salary: 'Salary',
                        workHours: 'Work Hours per Day',
                        biweekly: 'Bi-weekly',
                        monthly: 'Monthly',
                        yearly: 'Yearly',
                        start: 'Start Timer',
                        stop: 'Stop Timer',
                        pause: 'Pause',
                        resume: 'Resume',
                        cancel: 'Cancel',
                        earned: 'You Have Earned',
                        workTime: 'Work Time',
                        perSecond: 'Per Second',
                        perHour: 'Per Hour',
                        perDay: 'Per Day',
                        intro: 'Turn work time into visible earnings.',
                        privacy: 'No account or saved salary. Estimates use fixed workday assumptions and are for fun.',
                        period: 'Pay period',
                        currency: 'Switch salary currency',
                        referenceRate: 'API reference rate',
                        fallbackRate: 'Fallback reference rate',
                        estimate: 'Estimate only; not a payroll record'
                    }
                };

                this.initializeElements();
                this.attachEventListeners();
                this.updateExchangeRate();
                this.updateCurrencySuffix();
                this.validateInputs();
                this.updateRateNote();
            }

            initializeElements() {
                this.salaryTypeSelect = document.getElementById('salaryType');
                this.salaryAmountInput = document.getElementById('salaryAmount');
                this.workHoursInput = document.getElementById('workHours');
                this.startBtn = document.getElementById('startBtn');
                this.salaryDisplay = document.getElementById('salaryDisplay');
                this.progressBar = document.getElementById('progressBar');
                this.currencySuffix = document.getElementById('currencySuffix');
                this.centerBtnBox = document.getElementById('centerBtnBox');
                this.salaryAmountDisplay = document.getElementById('salaryAmountDisplay');
                this.workTimeDisplay = document.getElementById('workTimeDisplay');
                this.salaryFullDialog = document.getElementById('salaryFullDialog');
                this.fullDialogSalary = document.getElementById('fullDialogSalary');
                this.fullDialogTime = document.getElementById('fullDialogTime');
                this.fullDialogPerSecond = document.getElementById('fullDialogPerSecond');
                this.fullDialogPerHour = document.getElementById('fullDialogPerHour');
                this.fullDialogPerDay = document.getElementById('fullDialogPerDay');
                this.fullDialogCancel = document.getElementById('fullDialogCancel');
                this.fullDialogPause = document.getElementById('fullDialogPause');
                this.languageBtns = document.querySelectorAll('.language-btn');
            }

            attachEventListeners() {
                this.startBtn.addEventListener('click', () => this.toggleTimer());
                this.salaryAmountInput.addEventListener('input', () => this.validateInputs());
                this.workHoursInput.addEventListener('input', () => this.validateInputs());
                this.salaryTypeSelect.addEventListener('change', () => {
                    this.salaryType = this.salaryTypeSelect.value;
                    this.updatePlaceholder();
                });
                this.currencySuffix.addEventListener('click', () => {
                    this.currency = this.currency === 'CNY' ? 'USD' : 'CNY';
                    this.updateCurrencySuffix();
                    this.updatePlaceholder();
                    this.updateExchangeRate();
                });
                this.fullDialogCancel.addEventListener('click', () => {
                    this.salaryFullDialog.style.display = 'none';
                    this.stopTimer();
                });
                this.fullDialogPause.addEventListener('click', () => {
                    if (this.isPaused) {
                        this.resumeTimer();
                    } else {
                        this.pauseTimer();
                    }
                });
                this.languageBtns.forEach(btn => {
                    btn.addEventListener('click', () => {
                        const lang = btn.dataset.lang;
                        this.setLanguage(lang);
                    });
                });
            }

            async updateExchangeRate() {
                const now = Date.now();
                if (now - this.lastExchangeRateUpdate <= 3600000) return;
                try {
                    const response = await fetch('https://api.exchangerate-api.com/v4/latest/USD', {
                        signal: AbortSignal.timeout(5000),
                    });
                    if (!response.ok) throw new Error('Rate request failed');
                    const data = await response.json();
                    const rate = data?.rates?.CNY;
                    if (!Number.isFinite(rate) || rate <= 0) throw new Error('Invalid rate');
                    this.exchangeRate = rate;
                    this.rateSource = 'api';
                    this.lastExchangeRateUpdate = now;
                } catch {
                    // Keep a valid reference rate when the endpoint is unavailable.
                }
                this.updateRateNote();
                if (this.isRunning) this.update();
            }

            updateRateNote() {
                const text = this.translations[this.currentLang];
                const source = this.rateSource === 'api' ? text.referenceRate : text.fallbackRate;
                document.getElementById('rateNote').textContent = `${source}: 1 USD ≈ ${this.exchangeRate.toFixed(4)} CNY · ${text.estimate}`;
            }

            updateCurrencySuffix() {
                this.currencySuffix.textContent = this.currency === 'CNY' ? '¥' : '$';
            }

            updatePlaceholder() {
                this.salaryAmountInput.placeholder = this.translations[this.currentLang].salary;
            }

            formatCurrency(amount, currency) {
                const symbol = currency === 'CNY' ? '¥' : '$';
                return `${symbol}${amount.toFixed(2)}`;
            }

            convertCurrency(amount, fromCurrency, toCurrency) {
                if (fromCurrency === toCurrency) return amount;
                if (fromCurrency === 'USD' && toCurrency === 'CNY') {
                    return amount * this.exchangeRate;
                }
                return amount / this.exchangeRate;
            }

            validateInputs() {
                const amount = Number(this.salaryAmountInput.value);
                const hours = Number(this.workHoursInput.value);
                const isValid = Number.isFinite(amount) && amount > 0
                    && Number.isFinite(hours) && hours > 0 && hours <= 24;
                this.startBtn.disabled = !isValid;
            }

            toggleTimer() {
                if (!this.isRunning) {
                    this.startTimer();
                } else {
                    this.stopTimer();
                }
            }

            startTimer() {
                this.validateInputs();
                if (this.startBtn.disabled) return;

                this.salaryAmount = parseFloat(this.salaryAmountInput.value);
                this.workHours = parseFloat(this.workHoursInput.value);
                this.startTime = Date.now();
                this.isRunning = true;
                this.isPaused = false;
                this.startBtn.textContent = this.translations[this.currentLang].stop;
                this.salaryAmountInput.disabled = true;
                this.workHoursInput.disabled = true;
                this.salaryTypeSelect.disabled = true;
                this.currencySuffix.disabled = true;
                this.centerBtnBox.style.display = 'none';
                this.salaryDisplay.style.display = 'none';
                this.salaryFullDialog.style.display = 'flex';
                this.lastCoinTime = 0;
                this.pausedAt = null;
                this.update();
                this.salaryFullDialog.focus();

                this.interval = setInterval(() => this.update(), 50);
                this.fullDialogPause.textContent = this.translations[this.currentLang].pause;
            }

            stopTimer() {
                clearInterval(this.interval);
                this.isRunning = false;
                this.isPaused = false;
                this.startBtn.textContent = this.translations[this.currentLang].start;
                this.salaryAmountInput.disabled = false;
                this.workHoursInput.disabled = false;
                this.salaryTypeSelect.disabled = false;
                this.currencySuffix.disabled = false;
                this.centerBtnBox.style.display = 'flex';
                this.salaryDisplay.style.display = 'none';
                this.salaryFullDialog.style.display = 'none';
                this.startBtn.focus();
            }

            calculateHourlyRate() {
                const monthlyHours = 176; // 假设每月工作22天，每天8小时
                const yearlyHours = monthlyHours * 12;
                
                let hourlyRate;
                if (this.salaryType === 'monthly') {
                    hourlyRate = this.salaryAmount / monthlyHours;
                } else {
                    hourlyRate = this.salaryAmount / yearlyHours;
                }

                return hourlyRate;
            }

            update() {
                const elapsedMs = Math.max(0, (this.isPaused ? this.pausedAt : Date.now()) - this.startTime);
                const elapsedHours = elapsedMs / (1000 * 60 * 60);
                const workHoursPerDay = this.workHours; // 每天工作时长
                let perDay;
                if (this.salaryType === 'biweekly') {
                    perDay = this.salaryAmount / 10; // 每两周10个工作日
                } else if (this.salaryType === 'monthly') {
                    perDay = this.salaryAmount / 21; // 每月21个工作日
                } else {
                    perDay = this.salaryAmount / (52 * 5); // 每年52周，每周5个工作日
                }
                const perDayCNY = this.currency === 'CNY' ? perDay : this.convertCurrency(perDay, 'USD', 'CNY');
                const perDayUSD = this.currency === 'USD' ? perDay : this.convertCurrency(perDay, 'CNY', 'USD');
                // 每小时收入 = 每天收入 / 每天工作时长
                const perHourCNY = perDayCNY / workHoursPerDay;
                const perHourUSD = perDayUSD / workHoursPerDay;
                // 每秒收入 = 每小时收入 / 3600
                const perSecondCNY = perHourCNY / 3600;
                const perSecondUSD = perHourUSD / 3600;
                const salaryCNY = perHourCNY * elapsedHours;
                const salaryUSD = perHourUSD * elapsedHours;
                const primaryCurrency = this.currency === 'CNY' ? 'CNY' : 'USD';
                const secondaryCurrency = this.currency === 'CNY' ? 'USD' : 'CNY';
                const primaryAmount = this.currency === 'CNY' ? salaryCNY : salaryUSD;
                const secondaryAmount = this.currency === 'CNY' ? salaryUSD : salaryCNY;
                const primaryPerSecond = this.currency === 'CNY' ? perSecondCNY : perSecondUSD;
                const secondaryPerSecond = this.currency === 'CNY' ? perSecondUSD : perSecondCNY;
                const primaryPerHour = this.currency === 'CNY' ? perHourCNY : perHourUSD;
                const secondaryPerHour = this.currency === 'CNY' ? perHourUSD : perHourCNY;
                const primaryPerDay = this.currency === 'CNY' ? perDayCNY : perDayUSD;
                const secondaryPerDay = this.currency === 'CNY' ? perDayUSD : perDayCNY;

                this.fullDialogSalary.textContent = `${this.formatCurrency(primaryAmount, primaryCurrency)} (${this.formatCurrency(secondaryAmount, secondaryCurrency)})`;
                this.fullDialogTime.textContent = this.formatTime(elapsedMs);
                this.fullDialogPerSecond.textContent = `${this.formatCurrency(primaryPerSecond, primaryCurrency)} (${this.formatCurrency(secondaryPerSecond, secondaryCurrency)})`;
                this.fullDialogPerHour.textContent = `${this.formatCurrency(primaryPerHour, primaryCurrency)} (${this.formatCurrency(secondaryPerHour, secondaryCurrency)})`;
                this.fullDialogPerDay.textContent = `${this.formatCurrency(primaryPerDay, primaryCurrency)} (${this.formatCurrency(secondaryPerDay, secondaryCurrency)})`;
                const progress = (elapsedMs / (workHoursPerDay * 3600 * 1000)) * 100;
                this.progressBar.style.width = `${Math.min(progress, 100)}%`;
                if (Math.floor(salaryCNY / 100) > Math.floor(this.lastCoinTime / 100)) {
                    this.createCoins();
                }
                this.lastCoinTime = salaryCNY;
                if (elapsedMs >= workHoursPerDay * 3600 * 1000) {
                    this.stopTimer();
                }
            }

            formatTime(ms) {
                const seconds = Math.floor(ms / 1000);
                const hours = Math.floor(seconds / 3600);
                const minutes = Math.floor((seconds % 3600) / 60);
                const secs = seconds % 60;
                return `${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
            }

            createCoins() {
                for (let i = 0; i < 10; i++) {
                    const coin = document.createElement('div');
                    coin.className = 'coin';
                    coin.style.left = `${Math.random() * 100}vw`;
                    document.body.appendChild(coin);
                    coin.addEventListener('animationend', () => {
                        coin.remove();
                    });
                }
            }

            pauseTimer() {
                this.update();
                this.pausedAt = Date.now();
                clearInterval(this.interval);
                this.isPaused = true;
                this.fullDialogPause.textContent = this.translations[this.currentLang].resume;
            }

            resumeTimer() {
                if (!this.isPaused) return;
                this.startTime += Date.now() - this.pausedAt;
                this.pausedAt = null;
                this.isPaused = false;
                this.fullDialogPause.textContent = this.translations[this.currentLang].pause;
                this.update();
                this.interval = setInterval(() => this.update(), 50);
            }

            setLanguage(lang) {
                this.currentLang = lang;
                this.languageBtns.forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.lang === lang);
                });
                document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
                document.querySelector('h1').textContent = this.translations[lang].title;
                document.getElementById('intro').textContent = this.translations[lang].intro;
                document.getElementById('salaryLabel').textContent = this.translations[lang].salary;
                document.getElementById('hoursLabel').textContent = this.translations[lang].workHours;
                document.getElementById('periodLabel').textContent = this.translations[lang].period;
                document.getElementById('pageNote').firstChild.textContent = this.translations[lang].privacy;
                this.salaryAmountInput.setAttribute('aria-label', this.translations[lang].salary);
                this.workHoursInput.setAttribute('aria-label', this.translations[lang].workHours);
                this.salaryTypeSelect.setAttribute('aria-label', this.translations[lang].period);
                this.currencySuffix.setAttribute('aria-label', this.translations[lang].currency);
                this.updateRateNote();
                this.salaryAmountInput.placeholder = this.translations[lang].salary;
                this.workHoursInput.placeholder = this.translations[lang].workHours;
                this.salaryTypeSelect.options[0].text = this.translations[lang].biweekly;
                this.salaryTypeSelect.options[1].text = this.translations[lang].monthly;
                this.salaryTypeSelect.options[2].text = this.translations[lang].yearly;
                this.startBtn.textContent = this.isRunning ? this.translations[lang].stop : this.translations[lang].start;
                this.fullDialogPause.textContent = this.isPaused ? this.translations[lang].resume : this.translations[lang].pause;
                this.fullDialogCancel.textContent = this.translations[lang].cancel;
                document.querySelector('.dialog-earned-title').textContent = this.translations[lang].earned;
                document.querySelectorAll('.dialog-row .label')[0].textContent = this.translations[lang].workTime;
                document.querySelectorAll('.dialog-row .label')[1].textContent = this.translations[lang].perSecond;
                document.querySelectorAll('.dialog-row .label')[2].textContent = this.translations[lang].perHour;
                document.querySelectorAll('.dialog-row .label')[3].textContent = this.translations[lang].perDay;
            }
        }
        const calculator = new SalaryCalculator();
    </script>
</body>
</html>
