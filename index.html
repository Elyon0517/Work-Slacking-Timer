<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Work Slacking Timer</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#FFD700">
    <meta name="mobile-web-app-capable" content="yes">
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
                navigator.serviceWorker.register('sw.js');
            });
        }
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
        }

        body {
            min-height: 100vh;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 1rem;
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #1a1a1a, #2a2a2a);
            color: #fff;
        }

        .container {
            max-width: 800px;
            width: 100%;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            position: relative;
            padding: 1rem;
        }

        .language-switcher {
            position: absolute;
            top: 1rem;
            right: 1rem;
            display: flex;
            gap: 0.5rem;
            z-index: 1000;
        }

        .language-btn {
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.9rem;
        }

        .language-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .language-btn.active {
            background: #4CAF50;
        }

        .input-group {
            margin: 1.5rem 0;
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
            width: 100%;
            max-width: 600px;
        }

        .input-wrapper {
            display: flex;
            align-items: center;
            position: relative;
            min-width: 180px;
            max-width: 240px;
            width: 100%;
            box-sizing: border-box;
        }

        .input-wrapper input,
        .input-wrapper select {
            padding: 0.8rem;
            border: none;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            font-size: 1rem;
            width: 100%;
            box-sizing: border-box;
        }

        .input-wrapper input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .salary-input {
            padding-left: 2.2rem !important;
            padding-right: 0.8rem !important;
        }

        .currency-suffix {
            position: absolute;
            left: 0.7rem;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1rem;
            color: #fff;
            cursor: pointer;
            user-select: none;
            opacity: 0.85;
            transition: color 0.2s, opacity 0.2s;
            z-index: 2;
        }

        .currency-suffix:hover {
            color: #4CAF50;
            opacity: 1;
        }

        .center-btn {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 6rem;
            margin: 1rem 0;
        }

        .btn {
            width: 220px;
            font-size: 1rem;
            padding: 0.8rem 2rem;
            border: none;
            border-radius: 8px;
            background: #4CAF50;
            color: white;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
            background: #45a049;
        }

        .btn:disabled {
            background: #666;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            background: #FFA500;
        }

        .btn-secondary:hover {
            background: #e69500;
        }

        .salary-display {
            font-size: 2.5rem;
            font-weight: bold;
            margin: 1rem 0 0.5rem 0;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
            transition: transform 0.3s;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 3.5rem;
        }

        .salary-display .worktime {
            font-size: 1.2rem;
            color: #ffd700;
            margin-top: 0.5rem;
            text-shadow: none;
            font-weight: normal;
        }

        .progress-container {
            width: 100%;
            max-width: 400px;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            margin: 1rem 0;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #4CAF50, #FFD700);
            width: 0%;
            transition: width 0.3s ease;
            border-radius: 4px;
        }

        .salary-full-dialog {
            position: fixed;
            left: 0;
            top: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(34, 34, 34, 0.98);
            color: #fff;
            z-index: 9999;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }

        .salary-full-dialog-content {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 18px;
            padding: 2rem 1.5rem;
        }

        .dialog-earned-title {
            font-size: 2rem;
            font-weight: bold;
            color: #fffbe6;
            margin-bottom: 0.5rem;
            text-align: center;
        }

        .dialog-earned-amount {
            font-size: 2.8rem;
            font-weight: bold;
            color: #ffd700;
            margin-bottom: 1.5rem;
            text-align: center;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
        }

        .dialog-row {
            font-size: 1.1rem;
            margin: 0.6rem 0;
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 350px;
        }

        .dialog-row .label {
            color: #aaa;
        }

        .dialog-row .value {
            font-weight: bold;
            color: #ffd700;
        }

        .dialog-actions {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-top: 2rem;
            flex-wrap: wrap;
        }

        .coin {
            position: absolute;
            width: 30px;
            height: 30px;
            background: gold;
            border-radius: 50%;
            pointer-events: none;
            animation: fall 2s linear forwards;
        }

        @keyframes fall {
            0% {
                transform: translateY(-100vh) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(100vh) rotate(360deg);
                opacity: 0;
            }
        }

        .glow {
            animation: glow 1s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from {
                text-shadow: 0 0 10px #fff, 0 0 20px #fff, 0 0 30px #4CAF50;
            }
            to {
                text-shadow: 0 0 20px #fff, 0 0 30px #4CAF50, 0 0 40px #4CAF50;
            }
        }

        .currency-amount {
            display: flex;
            align-items: baseline;
            gap: 0.5rem;
            font-size: 1.2rem;
            flex-wrap: wrap;
            justify-content: center;
        }

        .currency-amount span {
            font-size: 0.9em;
            opacity: 0.8;
        }

        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        input[type="number"] {
            -moz-appearance: textfield;
        }

        .stats-section {
            margin-top: 2rem;
            width: 100%;
            max-width: 600px;
        }

        .stats-title {
            font-size: 1.2rem;
            margin-bottom: 1rem;
            color: #ffd700;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1rem;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.05);
            padding: 1rem;
            border-radius: 12px;
            text-align: center;
        }

        .stat-card .value {
            font-size: 1.3rem;
            font-weight: bold;
            color: #ffd700;
        }

        .stat-card .label {
            font-size: 0.85rem;
            color: #aaa;
            margin-top: 0.3rem;
        }

        @media (max-width: 600px) {
            .salary-display {
                font-size: 2rem;
            }

            .dialog-earned-amount {
                font-size: 2.2rem;
            }

            .input-wrapper {
                min-width: 100%;
                max-width: 100%;
            }

            .input-group {
                flex-direction: column;
                align-items: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="language-switcher">
            <button class="language-btn active" data-lang="zh">中文</button>
            <button class="language-btn" data-lang="en">English</button>
        </div>
        <h1 class="glow">摸鱼计时器</h1>

        <div class="input-group">
            <div class="input-wrapper">
                <input type="number" id="salaryAmount" class="salary-input"
                       placeholder="薪资" min="0" step="0.01">
                <span class="currency-suffix" id="currencySuffix">¥</span>
            </div>
            <div class="input-wrapper">
                <input type="number" id="workHours"
                       placeholder="每天工作时长（小时）" min="0" step="0.5">
            </div>
            <div class="input-wrapper">
                <select id="salaryType">
                    <option value="biweekly">两周薪</option>
                    <option value="monthly">月薪</option>
                    <option value="yearly">年薪</option>
                </select>
            </div>
        </div>

        <div class="center-btn" id="centerBtnBox">
            <button id="startBtn" class="btn">开始计时</button>
        </div>

        <div class="salary-display" id="salaryDisplay" style="display: none;">
            <div class="currency-amount" id="salaryAmountDisplay">
                <span>¥0.00</span>
                <span>(≈$0.00)</span>
            </div>
            <div class="worktime" id="workTimeDisplay">00:00:00</div>
        </div>

        <div class="progress-container">
            <div class="progress-bar" id="progressBar"></div>
        </div>

        <!-- 今日累计统计 -->
        <div class="stats-section" id="statsSection" style="display: none;">
            <div class="stats-title">今日累计</div>
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="value" id="todayTotal">¥0.00</div>
                    <div class="label">总收入</div>
                </div>
                <div class="stat-card">
                    <div class="value" id="todayTime">00:00:00</div>
                    <div class="label">总时长</div>
                </div>
                <div class="stat-card">
                    <div class="value" id="todayAvg">¥0.00/h</div>
                    <div class="label">平均时薪</div>
                </div>
            </div>
        </div>

        <!-- 全屏弹窗 -->
        <div class="salary-full-dialog" id="salaryFullDialog">
            <div class="salary-full-dialog-content">
                <div class="dialog-earned-title">您已经赚到</div>
                <div class="dialog-earned-amount" id="fullDialogSalary">¥0.00 (≈$0.00)</div>

                <div class="dialog-row">
                    <span class="label">已工作时长</span>
                    <span class="value" id="fullDialogTime">00:00:00</span>
                </div>
                <div class="dialog-row">
                    <span class="label">每秒收入</span>
                    <span class="value" id="fullDialogPerSecond">¥0.00</span>
                </div>
                <div class="dialog-row">
                    <span class="label">每小时收入</span>
                    <span class="value" id="fullDialogPerHour">¥0.00</span>
                </div>
                <div class="dialog-row">
                    <span class="label">每日收入</span>
                    <span class="value" id="fullDialogPerDay">¥0.00</span>
                </div>

                <div class="dialog-actions">
                    <button class="btn btn-secondary" id="fullDialogPause">暂停</button>
                    <button class="btn" id="fullDialogCancel">取消计时</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        class SalaryCalculator {
            constructor() {
                // 配置
                this.salaryAmount = 0;
                this.workHours = 0;
                this.startTime = null;
                this.interval = null;
                this.lastCoinTime = 0;
                this.isRunning = false;
                this.isPaused = false;
                this.salaryType = 'biweekly';
                this.currency = 'CNY';
                this.exchangeRate = 7.2;
                this.lastExchangeRateUpdate = 0;
                this.currentLang = 'zh';

                // 今日统计
                this.todayTotalMs = parseInt(localStorage.getItem('todayTotalMs') || '0', 10);
                this.todayDate = localStorage.getItem('todayDate') || '';
                this.todayTotal = parseFloat(localStorage.getItem('todayTotal') || '0');

                // 重置今日统计
                this.checkAndResetToday();

                // 翻译
                this.translations = {
                    zh: {
                        title: '摸鱼计时器',
                        salary: '薪资',
                        workHours: '每天工作时长（小时）',
                        biweekly: '两周薪',
                        monthly: '月薪',
                        yearly: '年薪',
                        start: '开始计时',
                        stop: '停止计时',
                        pause: '暂停',
                        resume: '继续',
                        cancel: '取消计时',
                        earned: '您已经赚到',
                        workTime: '已工作时长',
                        perSecond: '每秒收入',
                        perHour: '每小时收入',
                        perDay: '每日收入',
                        todayTotal: '今日累计',
                        totalIncome: '总收入',
                        totalTime: '总时长',
                        avgHourly: '平均时薪'
                    },
                    en: {
                        title: 'Work Slacking Timer',
                        salary: 'Salary',
                        workHours: 'Work Hours per Day',
                        biweekly: 'Bi-weekly',
                        monthly: 'Monthly',
                        yearly: 'Yearly',
                        start: 'Start Timer',
                        stop: 'Stop Timer',
                        pause: 'Pause',
                        resume: 'Resume',
                        cancel: 'Cancel',
                        earned: 'You Have Earned',
                        workTime: 'Work Time',
                        perSecond: 'Per Second',
                        perHour: 'Per Hour',
                        perDay: 'Per Day',
                        todayTotal: 'Today\'s Total',
                        totalIncome: 'Total Income',
                        totalTime: 'Total Time',
                        avgHourly: 'Avg Hourly'
                    }
                };

                this.initializeElements();
                this.attachEventListeners();
                this.loadSavedSettings();
                this.updateExchangeRate();
                this.updateCurrencySuffix();
                this.updateTodayStats();
            }

            checkAndResetToday() {
                const today = new Date().toDateString();
                if (this.todayDate !== today) {
                    this.todayDate = today;
                    this.todayTotalMs = 0;
                    this.todayTotal = 0;
                    localStorage.setItem('todayDate', today);
                    localStorage.setItem('todayTotalMs', '0');
                    localStorage.setItem('todayTotal', '0');
                }
            }

            saveSettings() {
                localStorage.setItem('salaryAmount', this.salaryAmountInput.value);
                localStorage.setItem('workHours', this.workHoursInput.value);
                localStorage.setItem('salaryType', this.salaryTypeSelect.value);
                localStorage.setItem('currency', this.currency);
                localStorage.setItem('language', this.currentLang);
            }

            loadSavedSettings() {
                const savedSalary = localStorage.getItem('salaryAmount');
                const savedWorkHours = localStorage.getItem('workHours');
                const savedType = localStorage.getItem('salaryType');
                const savedCurrency = localStorage.getItem('currency');
                const savedLang = localStorage.getItem('language');

                if (savedSalary) this.salaryAmountInput.value = savedSalary;
                if (savedWorkHours) this.workHoursInput.value = savedWorkHours;
                if (savedType) {
                    this.salaryTypeSelect.value = savedType;
                    this.salaryType = savedType;
                }
                if (savedCurrency) {
                    this.currency = savedCurrency;
                    this.updateCurrencySuffix();
                }
                if (savedLang) {
                    this.setLanguage(savedLang);
                }
                this.validateInputs();
            }

            initializeElements() {
                this.salaryTypeSelect = document.getElementById('salaryType');
                this.salaryAmountInput = document.getElementById('salaryAmount');
                this.workHoursInput = document.getElementById('workHours');
                this.startBtn = document.getElementById('startBtn');
                this.salaryDisplay = document.getElementById('salaryDisplay');
                this.progressBar = document.getElementById('progressBar');
                this.currencySuffix = document.getElementById('currencySuffix');
                this.centerBtnBox = document.getElementById('centerBtnBox');
                this.salaryAmountDisplay = document.getElementById('salaryAmountDisplay');
                this.workTimeDisplay = document.getElementById('workTimeDisplay');
                this.salaryFullDialog = document.getElementById('salaryFullDialog');
                this.fullDialogSalary = document.getElementById('fullDialogSalary');
                this.fullDialogTime = document.getElementById('fullDialogTime');
                this.fullDialogPerSecond = document.getElementById('fullDialogPerSecond');
                this.fullDialogPerHour = document.getElementById('fullDialogPerHour');
                this.fullDialogPerDay = document.getElementById('fullDialogPerDay');
                this.fullDialogCancel = document.getElementById('fullDialogCancel');
                this.fullDialogPause = document.getElementById('fullDialogPause');
                this.languageBtns = document.querySelectorAll('.language-btn');
                this.statsSection = document.getElementById('statsSection');
            }

            attachEventListeners() {
                this.startBtn.addEventListener('click', () => this.toggleTimer());
                this.salaryAmountInput.addEventListener('input', () => {
                    this.validateInputs();
                    this.saveSettings();
                });
                this.workHoursInput.addEventListener('input', () => {
                    this.validateInputs();
                    this.saveSettings();
                });
                this.salaryTypeSelect.addEventListener('change', () => {
                    this.salaryType = this.salaryTypeSelect.value;
                    this.updatePlaceholder();
                    this.saveSettings();
                });
                this.currencySuffix.addEventListener('click', () => {
                    this.currency = this.currency === 'CNY' ? 'USD' : 'CNY';
                    this.updateCurrencySuffix();
                    this.updatePlaceholder();
                    this.updateExchangeRate();
                    this.saveSettings();
                });
                this.fullDialogCancel.addEventListener('click', () => {
                    this.salaryFullDialog.style.display = 'none';
                    this.stopTimer();
                });
                this.fullDialogPause.addEventListener('click', () => {
                    if (this.isPaused) {
                        this.resumeTimer();
                    } else {
                        this.pauseTimer();
                    }
                });
                this.languageBtns.forEach(btn => {
                    btn.addEventListener('click', () => {
                        const lang = btn.dataset.lang;
                        this.setLanguage(lang);
                        this.saveSettings();
                    });
                });
            }

            async updateExchangeRate() {
                const now = Date.now();
                // 每小时更新一次汇率
                if (now - this.lastExchangeRateUpdate > 3600000) {
                    try {
                        const response = await fetch('https://api.exchangerate-api.com/v4/latest/USD');
                        if (!response.ok) throw new Error('Network response was not ok');
                        const data = await response.json();
                        if (data.rates && data.rates.CNY) {
                            this.exchangeRate = data.rates.CNY;
                            this.lastExchangeRateUpdate = now;
                        }
                    } catch (error) {
                        console.warn('获取汇率失败，使用缓存汇率:', error.message);
                        // 使用缓存汇率，不做处理
                    }
                }
            }

            updateCurrencySuffix() {
                this.currencySuffix.textContent = this.currency === 'CNY' ? '¥' : '$';
            }

            updatePlaceholder() {
                this.salaryAmountInput.placeholder = this.translations[this.currentLang].salary;
            }

            formatCurrency(amount, currency) {
                const symbol = currency === 'CNY' ? '¥' : '$';
                return `${symbol}${amount.toFixed(2)}`;
            }

            convertCurrency(amount, fromCurrency, toCurrency) {
                if (fromCurrency === toCurrency) return amount;
                if (fromCurrency === 'USD' && toCurrency === 'CNY') {
                    return amount * this.exchangeRate;
                }
                return amount / this.exchangeRate;
            }

            validateInputs() {
                const isValid = this.salaryAmountInput.value > 0 && this.workHoursInput.value > 0;
                this.startBtn.disabled = !isValid;
            }

            toggleTimer() {
                if (!this.isRunning) {
                    this.startTimer();
                } else {
                    this.stopTimer();
                }
            }

            startTimer() {
                if (!this.salaryAmountInput.value || !this.workHoursInput.value) return;

                this.salaryAmount = parseFloat(this.salaryAmountInput.value);
                this.workHours = parseFloat(this.workHoursInput.value);
                this.startTime = Date.now();
                this.isRunning = true;
                this.isPaused = false;
                this.startBtn.textContent = this.translations[this.currentLang].stop;
                this.salaryAmountInput.disabled = true;
                this.workHoursInput.disabled = true;
                this.salaryTypeSelect.disabled = true;
                this.currencySuffix.disabled = true;
                this.centerBtnBox.style.display = 'none';
                this.salaryDisplay.style.display = 'none';
                this.statsSection.style.display = 'none';
                this.salaryFullDialog.style.display = 'flex';
                this.fullDialogPause.textContent = this.translations[this.currentLang].pause;

                this.interval = setInterval(() => this.update(), 50);
            }

            stopTimer() {
                clearInterval(this.interval);
                this.isRunning = false;
                this.isPaused = false;
                this.startBtn.textContent = this.translations[this.currentLang].start;
                this.salaryAmountInput.disabled = false;
                this.workHoursInput.disabled = false;
                this.salaryTypeSelect.disabled = false;
                this.currencySuffix.disabled = false;
                this.centerBtnBox.style.display = 'flex';
                this.salaryDisplay.style.display = 'none';
                this.salaryFullDialog.style.display = 'none';
                this.statsSection.style.display = 'block';
                this.updateTodayStats();
            }

            calculateRates() {
                const workHoursPerDay = this.workHours;
                let perDay;

                if (this.salaryType === 'biweekly') {
                    perDay = this.salaryAmount / 10;
                } else if (this.salaryType === 'monthly') {
                    perDay = this.salaryAmount / 21;
                } else {
                    perDay = this.salaryAmount / (52 * 5);
                }

                const perDayInCurrency = this.currency === 'CNY' ? perDay : this.convertCurrency(perDay, 'USD', 'CNY');
                const perHour = perDayInCurrency / workHoursPerDay;
                const perSecond = perHour / 3600;

                return { perDay: perDayInCurrency, perHour, perSecond, perDayUSD: this.convertCurrency(perDayInCurrency, 'CNY', 'USD') };
            }

            update() {
                const elapsedMs = Date.now() - this.startTime;
                const rates = this.calculateRates();
                const salary = rates.perSecond * (elapsedMs / 1000);

                // 更新弹窗显示
                const primaryCurrency = this.currency;
                const secondaryCurrency = this.currency === 'CNY' ? 'USD' : 'CNY';
                const primaryAmount = salary;
                const secondaryAmount = this.convertCurrency(salary, 'CNY', 'USD');

                this.fullDialogSalary.textContent =
                    `${this.formatCurrency(primaryAmount, primaryCurrency)} (≈${this.formatCurrency(secondaryAmount, secondaryCurrency)})`;
                this.fullDialogTime.textContent = this.formatTime(elapsedMs);
                this.fullDialogPerSecond.textContent = this.formatCurrency(rates.perSecond, primaryCurrency);
                this.fullDialogPerHour.textContent = this.formatCurrency(rates.perHour, primaryCurrency);
                this.fullDialogPerDay.textContent = this.formatCurrency(rates.perDay, primaryCurrency);

                // 更新进度条
                const progress = (elapsedMs / (this.workHours * 3600 * 1000)) * 100;
                this.progressBar.style.width = `${Math.min(progress, 100)}%`;

                // 检查是否需要撒金币
                if (Math.floor(salary / 100) > Math.floor(this.lastCoinTime / 100)) {
                    this.createCoins();
                }
                this.lastCoinTime = salary;

                // 检查是否达到工作时长
                if (elapsedMs >= this.workHours * 3600 * 1000) {
                    this.stopTimer();
                }
            }

            formatTime(ms) {
                const seconds = Math.floor(ms / 1000);
                const hours = Math.floor(seconds / 3600);
                const minutes = Math.floor((seconds % 3600) / 60);
                const secs = seconds % 60;
                return `${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
            }

            createCoins() {
                for (let i = 0; i < 10; i++) {
                    const coin = document.createElement('div');
                    coin.className = 'coin';
                    coin.style.left = `${Math.random() * 100}vw`;
                    document.body.appendChild(coin);

                    coin.addEventListener('animationend', () => {
                        coin.remove();
                    });
                }
            }

            pauseTimer() {
                clearInterval(this.interval);
                this.isPaused = true;
                this.fullDialogPause.textContent = this.translations[this.currentLang].resume;
            }

            resumeTimer() {
                if (!this.isPaused) return;
                this.isPaused = false;
                this.fullDialogPause.textContent = this.translations[this.currentLang].pause;
                this.interval = setInterval(() => this.update(), 50);
            }

            updateTodayStats() {
                const t = this.translations[this.currentLang];
                document.getElementById('todayTotal').textContent =
                    `${this.formatCurrency(this.todayTotal, 'CNY')} (≈${this.formatCurrency(this.convertCurrency(this.todayTotal, 'CNY', 'USD'), 'USD')})`;
                document.getElementById('todayTime').textContent = this.formatTime(this.todayTotalMs);

                const avgHourly = this.todayTotalMs > 0 ? (this.todayTotal / (this.todayTotalMs / 3600000)) : 0;
                document.getElementById('todayAvg').textContent = `${this.formatCurrency(avgHourly, 'CNY')}/h`;

                document.querySelector('.stats-title').textContent = t.todayTotal;
                document.querySelector('.stat-card:nth-child(1) .label').textContent = t.totalIncome;
                document.querySelector('.stat-card:nth-child(2) .label').textContent = t.totalTime;
                document.querySelector('.stat-card:nth-child(3) .label').textContent = t.avgHourly;
            }

            setLanguage(lang) {
                this.currentLang = lang;
                const t = this.translations[lang];

                this.languageBtns.forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.lang === lang);
                });

                document.querySelector('h1').textContent = t.title;
                this.salaryAmountInput.placeholder = t.salary;
                this.workHoursInput.placeholder = t.workHours;
                this.salaryTypeSelect.options[0].text = t.biweekly;
                this.salaryTypeSelect.options[1].text = t.monthly;
                this.salaryTypeSelect.options[2].text = t.yearly;

                if (this.isRunning) {
                    this.startBtn.textContent = t.stop;
                    this.fullDialogPause.textContent = this.isPaused ? t.resume : t.pause;
                } else {
                    this.startBtn.textContent = t.start;
                }

                this.fullDialogCancel.textContent = t.cancel;
                document.querySelector('.dialog-earned-title').textContent = t.earned;

                const labels = document.querySelectorAll('.dialog-row .label');
                if (labels[0]) labels[0].textContent = t.workTime;
                if (labels[1]) labels[1].textContent = t.perSecond;
                if (labels[2]) labels[2].textContent = t.perHour;
                if (labels[3]) labels[3].textContent = t.perDay;
            }
        }

        const calculator = new SalaryCalculator();
    </script>
</body>
</html>
